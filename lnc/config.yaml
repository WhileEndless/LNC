output: output
disable_output_json: False
disable_output_text: False
write_errors_to_file: False
disable_output_end_prefix: False
enable_error_output: False
max_parallel_job: 5
retry_count: 3
delay_before_retry: 0.01
timeout: 2
smb_port: 445
ftp_port: 21
smb_shares_check_read: True
smb_shares_check_write: False
smb_files_ignore_shares:
  - ipc$
  - print$
always_download:
  - \.config$
  - \.ini$
  - \.dll$
  - \.txt$
  - \.metadata$
  - \.rsc$
download_folder: ./downloads/
max_download_size: 10
patterns:
  TCKN:
    - "[1-9]{1}[0-9]{9}[02468]{1}"
  credit_card:
    - "4[\\d\\s]{12}(?:[\\d\\s]{3})?"
    - "(?:5[1-5]|2[2-7])[\\d\\s]{14}"
    - "6(?:011|5[\\d\\s]{2})[\\d\\s]{12}"
    - "3[47][\\d\\s]{13}"
    - "3(?:0[0-5]|[68][\\d\\s])[\\d\\s]{11}"
    - "(?:2131|1800|35[\\d\\s]{3})[\\d\\s]{11}"
    - "(?:5[0678][\\d\\s]{2}|6304|6390|67[\\d\\s]{2})[\\d\\s]{8,15}"
  password:
    - "password"
    - "pwd="
    - "şifre"
    - "parola"
    - "sifre"
    - "contentHash"
check_binaries: True
take_before: 50
take_after: 50
keep_extracted_files: False
always_keep_extracted_files: False
add_filename_to_analyze: True
thread: 10
max_dir_entries: 1000
# Network accessibility check settings - Automatic failure detection and recovery
network_accessibility_check: True        # Enable/disable network monitoring (default: True)
auto_resume_on_recovery: True            # Auto-resume when network recovers (False: manual confirmation)
error_threshold_for_check: 10            # Number of errors before triggering network check
accessibility_check_interval: 30         # Seconds between network recovery checks
accessibility_check_timeout: 5           # Timeout for network accessibility tests
ignore_folder_name_contains:
  - "audio"
  - "bin"
  - "boot"
  - "dev"
  - "etc"
  - "lib"
  - "lib64"
  - "lost+found"
  - "media"
  - "opt"
  - "proc"
  - "run"
  - "sbin"
  - "srv"
  - "sys"
  - "tmp"
  - "usr"
  - "snap"
  - "swapfile"
  - "vmlinuz"
